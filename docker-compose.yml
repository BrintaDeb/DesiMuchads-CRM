version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: muchadcrm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muchad_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muchad_secret_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-muchadcrm_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muchad_admin} -d ${POSTGRES_DB:-muchadcrm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: muchadcrm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: muchadcrm-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-muchad_admin}:${POSTGRES_PASSWORD:-muchad_secret_password_2026}@db:5432/${POSTGRES_DB:-muchadcrm_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-muchad_admin}:${POSTGRES_PASSWORD:-muchad_secret_password_2026}@db:5432/${POSTGRES_DB:-muchadcrm_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      FERNET_ENCRYPTION_KEY: ${FERNET_ENCRYPTION_KEY:-yvG8s1n3M4u5n8w1x4b8k2n9m1p4q7r2s5t8u1v4w7x=}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock_gemini_key}
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: muchadcrm-celery-worker
    restart: always
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    depends_on:
      - backend
      - redis
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-muchad_admin}:${POSTGRES_PASSWORD:-muchad_secret_password_2026}@db:5432/${POSTGRES_DB:-muchadcrm_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-muchad_admin}:${POSTGRES_PASSWORD:-muchad_secret_password_2026}@db:5432/${POSTGRES_DB:-muchadcrm_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      FERNET_ENCRYPTION_KEY: ${FERNET_ENCRYPTION_KEY:-yvG8s1n3M4u5n8w1x4b8k2n9m1p4q7r2s5t8u1v4w7x=}

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: muchadcrm-celery-beat
    restart: always
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    depends_on:
      - backend
      - redis
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-muchad_admin}:${POSTGRES_PASSWORD:-muchad_secret_password_2026}@db:5432/${POSTGRES_DB:-muchadcrm_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-muchad_admin}:${POSTGRES_PASSWORD:-muchad_secret_password_2026}@db:5432/${POSTGRES_DB:-muchadcrm_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: muchadcrm-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/v1/realtime
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

