services:
  - type: web
    name: desimuchads-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./muchadcrm.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FERNET_SECRET_KEY
        value: Wk7eL4sK3wXy_mockFernetKeyBase64Sample32B=
      - key: DEBUG
        value: "false"
      - key: REDIS_URL
        value: ""

